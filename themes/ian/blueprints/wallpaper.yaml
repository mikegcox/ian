title: Item
'@extends':
    type: default
    context: blueprints://pages

form:
  fields:
    tabs:
      fields:
        content:
          type: tab
          title: Content

          fields:

            header_image:
              type: section
              title: Wallpaper Image
              underline: true

            header.wallpaper:
              type: pagemediaselect
              toggleable: true
              label: Wallpaper - Wide Ratio
              help: This is the image that will be downloaded by visitors and it will show in the header and listing.
              placeholder: Choose your wallpaper image
            header.wallpaper_ipad:
              type: pagemediaselect
              toggleable: true
              label: Wallpaper - iPad Ratio
              help: This is the image that will be downloaded by visitors and it will show in the header and listing.
              placeholder: Choose your wallpaper image for iPad 
            header.header_image:
              type: toggle
              toggleable: true              
              label: Header image
              highlight: 1
              options:
                wallpaper: Wide Picture
                wallpaper_ipad: iPad Picture   
            header.rentals:
              type: toggle
              toggleable: true              
              label: Show Rentals
              highlight: 1
              options:
                "true: 'include rentals page content'"
                "false: 'Do not show rentals'"                       
        options:
          type: tab
          title: PLUGIN_ADMIN.OPTIONS

          fields:

            publishing:
              type: section
              title: PLUGIN_ADMIN.PUBLISHING
              underline: true

              fields:
                header.published:
                  type: ignore
        blog:
          type: tab
          title: Blog Item

          fields:

            summary:
              type: section
              title: Summary
              underline: true


            header.summary.enabled:
              type: toggle
              toggleable: true
              label: Summary
              highlight: 1
              options:
                1: Enabled
                0: Disabled

            header.summary.format:
              type: select
              toggleable: true
              label: Format
              classes: fancy
              options:
                'short': 'Use the first occurence of delimter or size'
                'long': 'Summary delimiter will be ignored'

            header.summary.size:
              type: text
              toggleable: true
              label: Size
              classes: large
              placeholder: 300
              validate:
                type: int
                min: 1

            header.summary.delimiter:
              type: text
              toggleable: true
              label: Summary delimiter
              classes: large
              placeholder: ===
